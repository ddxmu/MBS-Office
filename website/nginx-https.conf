server {
    listen 80;
    listen [::]:80;
    server_name mbs.ddxmu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mbs-office/acme;
    }
    location / {
        return 301 https://mbs.ddxmu.com$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mbs.ddxmu.com;
    ssl_certificate /etc/letsencrypt/live/mbs.ddxmu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbs.ddxmu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/mbs-office/current;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(png|svg|css|js)$ {
        try_files $uri =404;
        expires 1h;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
